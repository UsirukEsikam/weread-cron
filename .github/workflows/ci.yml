name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

jobs:
  vet-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
