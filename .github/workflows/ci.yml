name: CI

on:
  push:
  pull_request:
  # 可复用入口：Release GHCR 工作流以本文件为 test 门禁（避免双份 test 定义）。
  workflow_call:

jobs:
  vet-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
